<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerador de Documentos – PodoSaúde</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main class="inicio">
    <img src="logo.png" alt="Clínica PodoSaúde" width="305" height="293">
    <h1>Gerador de Documentos</h1>
    <p>Escolha o documento que deseja preencher.</p>

    <div class="cartoes">
      <a class="cartao" href="recibo.html">
        <div class="icone" aria-hidden="true">🧾</div>
        <strong>Recibo</strong>
        <span>Comprovante de pagamento de serviço ou produto</span>
        <span class="seta">Preencher recibo</span>
      </a>
      <a class="cartao" href="declaracao.html">
        <div class="icone" aria-hidden="true">🕒</div>
        <strong>Declaração de Permanência</strong>
        <span>Comprova data e horário em que o cliente esteve na clínica</span>
        <span class="seta">Preencher declaração</span>
      </a>
    </div>
  </main>
</body>
</html>
